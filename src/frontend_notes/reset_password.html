<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Smart Notes</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-theme-toggle">
        <button id="theme-toggle-btn">
            🌙 Dark Mode
        </button>
    </div>
    <div class="auth-card">
        <div class="auth-logo">N</div>
        <h1 class="auth-title">
            Đặt lại mật khẩu
        </h1>
        <p class="auth-subtitle">
            Khôi phục tài khoản bằng OTP hoặc email xác minh
        </p>

        <!-- Form 1: Yêu cầu gửi OTP / link đổi mật khẩu -->
        <form id="request-section" class="auth-form">
            <div class="input-group">
                <input type="email" id="request-email" class="auth-input" placeholder="Email của bạn">
            </div>
            <div id="message"></div>
            <div class="auth-links">
                <a href="index.html" onclick="goBack(); return false;">Quay lại đăng nhập</a>
            </div>
            <button type="button" class="auth-btn" onclick="handleRequestReset(event)">Gửi link / OTP đến email</button>
        </form>

        <!-- Form 2: Nhập OTP/Token và Mật khẩu mới -->
        <form id="reset-section" class="auth-form" style="display:none;">
            <div class="input-group">
                <input
                    type="email"
                    id="reset-email"
                    class="auth-input"
                    placeholder="Email của bạn">
            </div>

            <div class="input-group" id="otp-group">
                <input
                    type="text"
                    id="reset-otp"
                    class="auth-input"
                    placeholder="Mã OTP gồm 6 chữ số từ email">
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="reset-password"
                    class="auth-input"
                    placeholder="Mật khẩu mới (tối thiểu 6 ký tự)">
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="reset-confirm-password"
                    class="auth-input"
                    placeholder="Xác nhận mật khẩu mới">
            </div>

            <div id="reset-message"></div>

            <button
                type="button"
                class="auth-btn"
                onclick="handleResetPassword(event)">
                Xác nhận đổi mật khẩu
            </button>
            <div class="auth-links" style="margin-top: 15px;">
                <a href="index.html" onclick="goBack(); return false;">Quay lại đăng nhập</a>
            </div>
        </form>
    </div>

    <script>
        // Cấu hình URL Backend Render
        const backendHost = 'https://note-app-backend-3mbr.onrender.com';
        const apiBase = `${backendHost}/api/auth`;

        const params = new URLSearchParams(window.location.search);
        const tokenFromUrl = params.get('token');
        window.resetToken = '';

        // Nếu người dùng bấm thẳng vào link trong email có kèm token (?token=...)
        if (tokenFromUrl) {
            document.getElementById('request-section').style.display = 'none';
            document.getElementById('reset-section').style.display = 'block';
            window.resetToken = tokenFromUrl;
            document.getElementById('otp-group').style.display = 'none'; // Đã có link token thì ẩn ô nhập OTP
            document.getElementById('reset-password').focus();
        }

        function showMessage(text, type = 'black', targetId = 'message') {
            const messageEl = document.getElementById(targetId);
            if (messageEl) {
                messageEl.style.color = type;
                messageEl.textContent = text;
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // 1. Gửi yêu cầu đặt lại mật khẩu
        async function handleRequestReset(event) {
            if(event) event.preventDefault();
            const email = document.getElementById('request-email').value.trim();
            if (!email) {
                showMessage('Vui lòng nhập email.', 'red');
                return;
            }
            showMessage('Đang gửi yêu cầu...', 'blue');

            try {
                const response = await fetch(`${apiBase}/request-password-reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message, 'green');
                    // Chuyển sang form nhập OTP / mật khẩu mới sau 1 giây
                    setTimeout(() => {
                        document.getElementById('request-section').style.display = 'none';
                        document.getElementById('reset-section').style.display = 'block';
                        document.getElementById('reset-email').value = email;
                    }, 1000);
                } else {
                    showMessage(data.message || 'Có lỗi xảy ra.', 'red');
                }
            } catch (error) {
                showMessage('Không thể kết nối đến máy chủ backend.', 'red');
            }
        }

        // 2. Xác nhận đặt lại mật khẩu bằng Token hoặc OTP
        async function handleResetPassword(event) {
            if(event) event.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            const token = window.resetToken || '';
            const otp = document.getElementById('reset-otp').value.trim();
            const password = document.getElementById('reset-password').value.trim();
            const confirmPassword = document.getElementById('reset-confirm-password').value.trim();

            if (!password || !confirmPassword) {
                showMessage('Vui lòng nhập đủ mật khẩu mới và xác nhận.', 'red', 'reset-message');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Mật khẩu và xác nhận không khớp.', 'red', 'reset-message');
                return;
            }
            if (password.length < 6) {
                showMessage('Mật khẩu phải có từ 6 ký tự trở lên.', 'red', 'reset-message');
                return;
            }
            if (!token && (!email || !otp)) {
                showMessage('Vui lòng nhập email và mã OTP từ hộp thư.', 'red', 'reset-message');
                return;
            }

            const payload = { password };
            if (token) {
                payload.token = token;
            } else {
                payload.email = email;
                payload.otp = otp;
            }

            showMessage('Đang cập nhật mật khẩu...', 'blue', 'reset-message');
            try {
                const response = await fetch(`${apiBase}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage(data.message, 'green', 'reset-message');
                    setTimeout(() => goBack(), 2000);
                } else {
                    showMessage(data.message || 'Có lỗi xảy ra.', 'red', 'reset-message');
                }
            } catch (error) {
                showMessage('Không thể kết nối đến máy chủ.', 'red', 'reset-message');
            }
        }
    </script>

    <!-- Script Dark Mode -->
    <script>
    const themeBtn = document.getElementById('theme-toggle-btn');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.innerHTML = '☀️ Light Mode';
    }
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeBtn.innerHTML = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    });
    </script>
</body>
</html>
